name: IdeaBox
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.example.IdeaBox
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"
packages:
  RichEditorSwiftUI:
    path: Vendor/RichEditorSwiftUI
targets:
  IdeaBox:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleVersion: "4"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIUserInterfaceStyle: Light
        NSMicrophoneUsageDescription: 用于录下语音灵感，或把你说的话转成可编辑的文字。
        NSSpeechRecognitionUsageDescription: 用于把语音转成文字草稿；系统可能将语音发送至 Apple 进行识别，草稿由你确认后发送。
        UIAppFonts:
          - Inter-Variable.ttf
          - NotoSansSC-Variable.ttf
          - NotoSansJP-Variable.ttf
    dependencies:
      - package: RichEditorSwiftUI
    sources:
      - path: .
        includes:
          - "**/*.swift"
        excludes:
          - "IdeaBox.xcodeproj/**"
          - "IdeaBox.xcworkspace/**"
          - "Vendor/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
        includes:
          - "*.ttf"
  IdeaBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IdeaBox.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IdeaBox
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: IdeaBox
    sources:
      - path: ../UITests
schemes:
  IdeaBox:
    build:
      targets:
        IdeaBox: all
        IdeaBoxUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: IdeaBoxUITests
          parallelizable: false

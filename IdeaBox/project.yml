name: IdeaBox
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.example.IdeaBox
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"
packages:
  RichEditorSwiftUI:
    path: Vendor/RichEditorSwiftUI
targets:
  IdeaBox:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleVersion: "3"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIUserInterfaceStyle: Light
        NSMicrophoneUsageDescription: 用于录下并保存你的语音灵感。录音只保存在这台设备上。
        UIAppFonts:
          - Inter-Variable.ttf
          - NotoSansSC-Variable.ttf
          - NotoSansJP-Variable.ttf
    dependencies:
      - package: RichEditorSwiftUI
    sources:
      - path: .
        includes:
          - "**/*.swift"
        excludes:
          - "IdeaBox.xcodeproj/**"
          - "IdeaBox.xcworkspace/**"
          - "Vendor/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
        includes:
          - "*.ttf"
